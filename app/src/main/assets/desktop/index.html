<!doctype html>
<html lang="en">
<head>

<title>Next Chapter · 新篇章</title>
<style>
  /* Served by the phone over your home Wi-Fi. Nothing here loads from the internet. */
  :root {
    --ground: #0b1129; --ground2: #17214a; --card: rgba(29, 40, 86, .78); --line: rgba(255, 255, 255, .07);
    --ink: #eef1ff; --muted: #a9b1d6; --sun: #ffcf7a; --rose: #ff8fb1; --jade: #4fb3a9; --violet: #8e94f2; --coral: #ff6b6b;
    --zh: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); overflow-x: hidden;
    font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1400px 800px at 75% -15%, #2c4280 0%, var(--ground2) 42%, var(--ground) 100%) fixed;
  }
  /* A quiet sky: two layers of tiny stars. */
  body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; }
  body::before {
    background-image:
      radial-gradient(1.2px 1.2px at 12% 18%, #fff8, transparent), radial-gradient(1px 1px at 33% 72%, #fff6, transparent),
      radial-gradient(1.4px 1.4px at 58% 12%, #fff9, transparent), radial-gradient(1px 1px at 81% 44%, #fff6, transparent),
      radial-gradient(1.2px 1.2px at 91% 82%, #fff7, transparent), radial-gradient(1px 1px at 22% 91%, #fff5, transparent),
      radial-gradient(1.3px 1.3px at 67% 63%, #fff6, transparent), radial-gradient(1px 1px at 45% 35%, #fff4, transparent);
    animation: twinkle 7s ease-in-out infinite alternate;
  }
  body::after {
    background-image:
      radial-gradient(1px 1px at 8% 55%, #fff5, transparent), radial-gradient(1.3px 1.3px at 28% 8%, #fff7, transparent),
      radial-gradient(1px 1px at 52% 88%, #fff5, transparent), radial-gradient(1.2px 1.2px at 73% 25%, #fff6, transparent),
      radial-gradient(1px 1px at 95% 10%, #fff5, transparent), radial-gradient(1.2px 1.2px at 38% 52%, #fff4, transparent);
    animation: twinkle 9s ease-in-out infinite alternate-reverse;

  @keyframes twinkle { from { opacity: .45; } to { opacity: 1; } }

  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 20px; padding: 14px 28px;
           background: linear-gradient(to bottom, rgba(11, 17, 41, .92), rgba(11, 17, 41, .6)); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }

  .btn:hover { filter: brightness(1.08); } .btn:active { transform: scale(.97); }
  .btn.ghost { background: rgba(255,255,255,.06); color: var(--ink); border: 1px solid var(--line); }
  input { font: inherit; color: var(--ink); background: rgba(9, 14, 36, .65); border: 1px solid rgba(255, 255, 255, .12); border-radius: 12px; padding: 10px 13px; transition: border-color .2s; }
  input:focus { outline: none; border-color: var(--sun); box-shadow: 0 0 0 3px rgba(255, 207, 122, .16); }
  /* Keyboard focus: a soft gold ring (mouse clicks don't show it). */
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }
  input:focus-visible { outline: none; }

  .t1 { color: var(--coral); } .t2 { color: var(--sun); } .t3 { color: var(--jade); } .t4 { color: var(--violet); } .t5 { color: var(--muted); }

  .phrases { display: grid; grid-template-columns: 250px 1fr; gap: 22px; max-width: 1280px; margin: 0 auto; padding: 22px 28px 60px; }

          width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; margin: 0; }

  .empty .big { font: 44px var(--zh); color: var(--sun); opacity: .8; }
  .empty h3 { color: var(--ink); margin: 8px 0 4px; }

  /* Loading: soft shimmering placeholder cards */
  .pc.skel { pointer-events: none; }
  .skel i { display: block; height: 14px; border-radius: 7px; margin: 9px 0; animation: shimmer 1.4s linear infinite;
            background: linear-gradient(90deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.13) 50%, rgba(255,255,255,.05) 100%) 0 0 / 200% 100%; }
  .skel i:first-child { height: 30px; width: 55%; } .skel i:nth-child(2) { width: 70%; } .skel i:nth-child(3) { width: 85%; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  /* ---- Review ---- */
  .review { max-width: 860px; margin: 0 auto; padding: 34px 28px 60px; }
  .progress { height: 6px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; margin-bottom: 18px; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--sun), var(--rose)); transition: width .4s; }
  .flash { perspective: 1400px; }
  .face { min-height: 360px; padding: 44px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
          transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .6s, border-color .6s; }
  .face.shown { border-color: rgba(255, 207, 122, .35); box-shadow: 0 0 0 1px rgba(255, 207, 122, .12), 0 0 70px -10px rgba(255, 207, 122, .35), 0 20px 50px -30px #000a; }
  .face .deckline { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .face .ask { margin-top: 18px; color: var(--muted); }

  .face .pinyin { animation-delay: .08s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .face.flip { animation: flip .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(12deg) scale(.98); opacity: .6; } 100% { transform: rotateX(0); } }
  .face .english { font-size: 30px; font-weight: 600; }

  .grades { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 10px; margin-top: 18px; }
  .grades .btn { padding: 14px 10px; }
  .g1 { background: var(--coral); } .g2 { background: var(--sun); } .g3 { background: var(--jade); } .g4 { background: var(--violet); }
  .hint { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .sumgrid { display: grid; grid-template-columns: repeat(3, minmax(110px, 1fr)); gap: 12px; margin: 20px 0 6px; width: min(520px, 100%); }
  .sumgrid div { padding: 14px 10px; border-radius: 16px; background: rgba(255,255,255,.05); }
  .sumgrid b { display: block; font-size: 32px; line-height: 1.2; }
  .sumgrid span { font-size: 13px; color: var(--muted); }

  .said { margin-top: 18px; padding: 10px 18px; border-radius: 14px; background: rgba(255,255,255,.05); animation: rise .4s both; }
  .said .chars { font: 30px var(--zh); letter-spacing: 4px; }

  .said.lvl2 { box-shadow: 0 0 40px -8px rgba(79,179,169,.6); } .said.miss { color: var(--coral); }
  /* ---- A+ ---- */

  .aplus .q { font-size: 28px; font-weight: 600; line-height: 1.35; }
  .aplus .a { font-size: 21px; margin-top: 22px; color: var(--sun); line-height: 1.5; animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
  .dom { margin: 12px 0; }

  .dom .top span:last-child { font-size: 12px; white-space: nowrap; }
  .dom .bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; margin-top: 5px; }
  .dom .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--violet), #b7bbff); }
  .dom.weak .top span:first-child { color: var(--coral); }
  .exam { font-size: 40px; font-weight: 700; color: var(--violet); }
  @media (max-width: 820px) { .aplus { grid-template-columns: 1fr; padding: 16px; } }
  /* ---- Sky ---- */
  .sky { max-width: 1400px; margin: 0 auto; padding: 18px 28px 40px; }
  .sky canvas { width: 100%; height: 72vh; display: block; border-radius: 22px; background: radial-gradient(1200px 600px at 50% 120%, #1d2a5c, #070b1d 70%); cursor: crosshair; }
  .sky .tip { position: fixed; pointer-events: none; padding: 8px 12px; border-radius: 12px; background: rgba(15, 22, 52, .95); border: 1px solid var(--line); display: none; z-index: 10; }
  .sky .tip .h { font: 24px var(--zh); }
  .sky .legend { display: flex; gap: 18px; align-items: center; margin: 12px 4px 0; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  /* ---- Terminal dojo ---- */
  .dojo { max-width: 1320px; margin: 0 auto; padding: 20px 28px 50px; }
  .dtop { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .seg { display: flex; gap: 4px; background: rgba(255,255,255,.05); padding: 4px; border-radius: 999px; }
  .seg button { background: none; border: 0; color: var(--muted); font-weight: 600; padding: 6px 16px; border-radius: 999px; cursor: pointer; transition: .2s; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: rgba(142, 148, 242, .25); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(142, 148, 242, .45); }
  .dprog { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .dprog .bar { width: 140px; height: 6px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; }
  .dprog .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--jade), #7ed6c9); transition: width .5s; }
  .picker { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
  .sc { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 0 9px; align-items: center; text-align: left; padding: 8px 11px; border-radius: 14px; cursor: pointer;
        background: rgba(29, 40, 86, .55); border: 1px solid var(--line); color: inherit; transition: background .15s, border-color .2s, transform .15s; }
  .sc:hover { background: rgba(29, 40, 86, .9); transform: translateY(-1px); }
  .sc.on { border-color: rgba(255, 207, 122, .55); background: rgba(255, 207, 122, .08); }

  .sc .nm { font-weight: 600; font-size: 13.5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 14px; }
  .sc .tp { font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .dots { letter-spacing: 2px; font-size: 9px; color: var(--sun); } .dots .off { color: rgba(255,255,255,.18); }
  .sc .ok { position: absolute; top: 6px; right: 9px; color: var(--jade); font-weight: 700; }
  .sc.solved .no { color: var(--jade); }
  .dwork { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 16px; align-items: start; }
  .term { position: relative; display: flex; flex-direction: column; height: 480px; border-radius: 18px; overflow: hidden;
          background: rgba(5, 8, 22, .94); border: 1px solid rgba(255,255,255,.09); box-shadow: 0 24px 60px -30px #000c; }
  .term.focus { border-color: rgba(255, 207, 122, .35); }
  .tbar { display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 14px; background: rgba(255,255,255,.045); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .tbar .tab { display: flex; align-items: center; gap: 7px; padding: 3px 10px; border-radius: 8px; background: rgba(255,255,255,.06); color: var(--ink); }
  .tbar .tab b { font: 700 11px ui-monospace, monospace; color: var(--sun); }
  .tbar .win { margin-left: auto; letter-spacing: 14px; opacity: .6; }
  .tout { flex: 1; overflow: auto; padding: 12px 16px 16px; cursor: text;
          font: 13.5px/1.45 "Cascadia Mono", "Cascadia Code", Consolas, "Courier New", ui-monospace, monospace; color: #cdd3f3; }
  .tout div { white-space: pre; min-height: 1.45em; }

  .tout .err { color: #ff9d9d; } .tout .ok { color: #8fe3d6; }
  .tout .note { color: #b7bbff; font-style: italic; white-space: pre-wrap; font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; }
  .tline .ghost { color: rgba(205, 211, 243, .35); font-style: italic; }
  .caret { display: inline-block; min-width: .6em; background: var(--sun); color: #0b1129; animation: blink 1.1s steps(1) infinite; }
  .term:not(.focus) .caret { background: none; color: inherit; box-shadow: inset 0 0 0 1px rgba(255, 207, 122, .6); animation: none; }
  @keyframes blink { 50% { background: transparent; color: inherit; } }
  .tin { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; }

  .steps li.done { color: var(--ink); } .steps li.done .m { color: var(--jade); } .steps li.next { color: var(--ink); }
  .steps li.done.pop .m { animation: popin .4s cubic-bezier(.2,1.6,.4,1); }
  @keyframes popin { from { transform: scale(0); } }

  .drow .btn { padding: 7px 13px; font-size: 13px; }
  .hintbox { margin-top: 10px; font-size: 13px; color: var(--muted); animation: rise .35s both; }
  .chip { font: 12.5px ui-monospace, Consolas, monospace; padding: 3px 9px; border-radius: 8px; background: rgba(0,0,0,.35); color: var(--sun); border: 1px solid rgba(255, 207, 122, .3); cursor: pointer; }

  .ch:hover { background: rgba(255,255,255,.09); }

  .ch.right { border-color: rgba(79, 179, 169, .7); background: rgba(79, 179, 169, .14); }

  .why h5 { margin: 0 0 4px; font-size: 11.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--jade); }

  @keyframes stamp { from { opacity: 0; transform: rotate(-8deg) scale(2); } }
  /* Port Rush */

<body>
<div class="net" id="net" role="status" aria-live="polite"><span class="moon" aria-hidden="true"></span><span>Phone not reachable — is Next Chapter's computer switch on and the phone on Wi-Fi? <span class="muted">Trying again every 5 s…</span></span></div>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
// localStorage can throw (private window, blocked site data), so every use goes through here.
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { if (v == null || v === "") localStorage.removeItem(k); else localStorage.setItem(k, v); } catch {} },
};
let token = ls.get("nc-token") || "";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const quiet = (msg) => Object.assign(new Error(msg), { quiet: true });

// ---- Talking to the phone ----
// If fetch() itself throws, the phone can't be reached (Wi-Fi, switch off, phone asleep): show the banner and keep
// the pairing. Only a 401 from the phone means "not paired any more". Other errors carry the phone's message.
async function api(path, body) {
  let r;
  try { r = await fetch(path, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json", "X-Token": token }, body: body ? JSON.stringify(body) : undefined }); }
  catch { offline(); throw quiet("Phone not reachable"); }
  backOnline();
  const pairing = path.startsWith("/api/pair");
  if (r.status === 401 && !pairing) { token = ""; ls.set("nc-token", null); showPair(); throw quiet("not paired"); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok && !pairing) throw new Error(data.message || `The phone answered ${r.status}`);
  return data;
}
function toast(text, err) {
  const t = $("#toast"); t.textContent = text; t.classList.toggle("err", !!err); t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), err ? 4000 : 1800);
}
// Anything not handled where it happened: say so quietly instead of failing silently.
window.addEventListener("unhandledrejection", (e) => { e.preventDefault(); if (!e.reason?.quiet) toast(e.reason?.message || "Something went wrong", true); });
function play(card) { if (card) new Audio(`/voice/${card.voice}.mp3?t=${encodeURIComponent(token)}`).play().catch(() => {}); }

// ---- Connection banner: retries every 5 s and goes away when the phone answers ----
let isOffline = false, netTimer = null, stale = false;
function offline() {
  if (isOffline) return;
  isOffline = true; $("#net").classList.add("on"); document.body.classList.add("offline");
  netTimer = setInterval(() => { fetch("/api/summary", { headers: { "X-Token": token } }).then(backOnline, () => {}); }, 5000);
}
function backOnline() {
  if (!isOffline) return;
  isOffline = false; clearInterval(netTimer); $("#net").classList.remove("on"); document.body.classList.remove("offline");
  if (!token) return;
  if (!$("header")) start();                         // the page opened while the phone was away
  else if (stale) go(view);                          // what's on screen never loaded: load it now
  else refreshSummary().catch(() => {});
}

// Pinyin coloured by tone, like the app (1 coral, 2 gold, 3 jade, 4 violet, neutral grey).
const MARKS = { 1: "āēīōūǖ", 2: "áéíóúǘ", 3: "ǎěǐǒǔǚ", 4: "àèìòùǜ" };
function toneOf(syl) { for (const t of [1, 2, 3, 4]) if ([...syl].some((ch) => MARKS[t].includes(ch))) return t; return 5; }
// Split "yìqǐ" into syllables so each one gets its own colour.
const V = "aeiouüvāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ";
const SYL = new RegExp(`(?:[zcs]h|[bpmfdtnlgkhjqxzcsrwy])?[${V}]+(?:ng(?![${V}])|n(?![${V}])|r(?![${V}]))?`, "gi");
// Where the search text appears (case-insensitive, like the phone's search).
function ranges(text, q) {
  const out = []; if (!q) return out;
  const low = text.toLowerCase(); let i = low.indexOf(q);
  while (i >= 0) { out.push([i, i + q.length]); i = low.indexOf(q, i + q.length); }
  return out;
}
function hl(text, q) {
  text = String(text ?? ""); let out = "", at = 0;
  for (const [a, b] of ranges(text, q)) { out += esc(text.slice(at, a)) + `<mark>${esc(text.slice(a, b))}</mark>`; at = b; }
  return out + esc(text.slice(at));
}
// Each letter gets its syllable's tone colour and, if it's part of the search match, a highlight.
function tonePinyin(p, q) {
  p = String(p ?? "");
  const cls = Array(p.length).fill(""), on = Array(p.length).fill(false);
  for (const m of p.matchAll(SYL)) for (let i = m.index; i < m.index + m[0].length; i++) cls[i] = "t" + toneOf(m[0]);
  for (const [a, b] of ranges(p, q)) for (let i = a; i < b; i++) on[i] = true;
  let out = "";
  for (let i = 0; i < p.length;) {
    let j = i; while (j < p.length && cls[j] === cls[i] && on[j] === on[i]) j++;
    let s = esc(p.slice(i, j)); if (cls[i]) s = `<span class="${cls[i]}">${s}</span>`; if (on[i]) s = `<mark>${s}</mark>`;
    out += s; i = j;
  }
  return out;
}

// ---- Dialogs: one helper so Esc, clicking outside and focus all work the same ----
function dialog(html, cls, label) {
  const opener = document.activeElement;
  const v = document.createElement("div"); v.className = "veil";
  v.innerHTML = `<div class="dialog glass ${cls || ""}" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>`;
  document.body.appendChild(v);
  v.close = () => { v.remove(); if (opener && opener.isConnected) opener.focus(); };
  v.onclick = (e) => { if (e.target === v) v.close(); };
  return v;
}
const topVeil = () => [...document.querySelectorAll(".veil")].pop();

// ---- Pairing ----
function showPair(message) {
  $("#app").innerHTML = `
    <div class="pair glass">
      <div class="zh" style="font-size:30px;color:var(--sun)">新篇章</div>
      <h2 style="margin:4px 0 6px">Next Chapter</h2>
      <p class="muted">Type the 6-digit code from your phone<br>(Settings → Use on my computer). Only once.</p>
      <input id="code" inputmode="numeric" maxlength="6" autofocus autocomplete="off" aria-label="6-digit code from your phone">
      <p style="color:var(--coral);min-height:1.5em" role="alert">${esc(message || "")}</p>
      <button class="btn" id="go">Connect</button>
    </div>`;
  const go = async () => {
    let r; try { r = await api("/api/pair", { code: $("#code").value }); } catch { return; }
    if (r.token) { token = r.token; ls.set("nc-token", token); start(); } else showPair(r.message);
  };
  $("#go").onclick = go; $("#code").onkeydown = (e) => { if (e.key === "Enter") go(); };
  $("#code").focus();
}

// ---- Shell ----
const VIEWS = ["phrases", "review", "aplus", "sky", "terminal"]; // the phone remote sends a tab as its index here
let view = VIEWS.includes(ls.get("nc-view")) ? ls.get("nc-view") : "phrases", summary = null;
const deckName = (id) => (summary?.decks.find((d) => d.id === id) || {}).title || id;
async function start() {
  try { summary = await api("/api/summary"); } catch { return; }
  if (deck && !summary.decks.some((d) => d.id === deck)) { deck = ""; ls.set("nc-deck", null); }
  $("#app").innerHTML = `
    <header>
      <div class="brand"><span class="zh">新篇章</span><span class="en">Next Chapter</span></div>
      <nav aria-label="Pages"><button data-v="phrases" title="G then P">Phrases</button><button data-v="review" title="G then R">Review</button><button data-v="aplus" title="G then A">A+</button><button data-v="sky" title="G then S">Sky ✦</button><button data-v="terminal" title="G then T">Terminal</button></nav>
      <div class="stats"><span class="remote-dot" id="rdot" title="Phone remote connected"></span><span id="stats"></span>
        <button class="icon help" id="help" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">?</button></div>
    </header>
    <main id="main"></main>`;
  document.querySelectorAll("nav button").forEach((b) => b.onclick = () => go(b.dataset.v));
  $("#help").onclick = toggleHelp;
  go(view);
  listen();
}
function go(v) {
  view = VIEWS.includes(v) ? v : "phrases"; ls.set("nc-view", view);
  document.querySelectorAll("nav button").forEach((b) => { b.classList.toggle("on", b.dataset.v === view); b.toggleAttribute("aria-current", b.dataset.v === view); });
  renderStats(); clearInterval(skyTimer); djStop();
  // If loading fails because the phone is away, remember it so the page reloads this view when it's back.
  watch(({ review: renderReview, aplus: renderAPlus, sky: renderSky, terminal: renderDojo }[view] || renderPhrases)());
}
function watch(p) {
  return Promise.resolve(p).then(() => { stale = false; }, (e) => { stale = true; if (!e?.quiet) toast(e?.message || "Couldn't load that", true); });
}
function renderStats() {
  const due = summary.due + summary.fresh;
  $("#stats").innerHTML = `<span class="pill sun">🔥 ${summary.streak}-day streak</span> <span class="pill">${summary.known} known</span> ${due ? `<span class="pill">${due} to review</span>` : ""}`;
}
async function refreshSummary() { summary = await api("/api/summary"); if ($("#stats")) renderStats(); }

// Tell the phone remote what's on screen.
function report(card, shown, left) {
  api("/api/state", { view, english: card?.english || "", hanzi: card?.hanzi || "", pinyin: card?.pinyin || "", shown: !!shown, left: left || 0 }).catch(() => {});
}

// ---- Keyboard: shortcuts everywhere, never while typing ----
const KEYS = [
  ["Anywhere", [["Phrases", "G P"], ["Review", "G R"], ["A+", "G A"], ["Sky", "G S"], ["Terminal dojo", "G T"], ["Add a phrase", "N"], ["Search phrases", "/"], ["This help", "?"], ["Close a dialog", "Esc"]]],
  ["Review and A+", [["Show the answer", "Space"], ["Again · Hard", "1 · 2"], ["Good · Easy", "3 · 4"], ["Play the phrase", "P"]]],
  ["Terminal dojo", [["Start typing in the terminal", "Enter"], ["Leave the terminal (shortcuts work again)", "Esc"], ["Earlier commands", "↑ ↓"], ["Answer the ticket question", "1 2 3 4"],
    ["Show a hint", "H"], ["Port Rush: start · skip one", "Enter"]]],
];
function toggleHelp() {
  const open = $(".dialog.keys"); if (open) return open.parentElement.close();
  const kb = (s) => s.split(" ").map((k) => k === "·" ? " " : `<kbd>${esc(k)}</kbd>`).join(" ");
  const v = dialog(`
    <h3>Keyboard shortcuts</h3>
    <div class="cols">${KEYS.map(([h, list]) => `<h5>${h}</h5>${list.map(([what, k]) => `<div class="k"><span>${what}</span><span>${kb(k)}</span></div>`).join("")}`).join("")}</div>
    <p class="tag" style="margin-top:14px">G then a letter: press G, let go, then the letter. Shortcuts pause while you're typing in a box.</p>
    <div class="row"><button class="btn" id="kclose">Got it</button></div>`, "keys", "Keyboard shortcuts");
  v.querySelector("#kclose").onclick = v.close; v.querySelector("#kclose").focus();
}
function focusSearch() { if (view !== "phrases") go("phrases"); const q = $("#q"); if (q) { q.focus(); q.select(); } }
let chord = 0;
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target, typing = t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  const veil = topVeil();
  if (e.key === "Escape") {
    if (veil) { e.preventDefault(); veil.close(); }
    else if (typing) t.blur();
    return;
  }
  if (typing || !$("header")) return;                 // typing, or still on the pairing screen
  if (e.key === "?") { e.preventDefault(); toggleHelp(); return; }
  if (veil) return;
  const k = e.key.toLowerCase();
  if (chord && Date.now() - chord < 1500) {
    chord = 0;
    const to = { p: "phrases", r: "review", a: "aplus", s: "sky", t: "terminal" }[k];
    if (to) { e.preventDefault(); go(to); return; }
  }
  chord = 0;
  if (k === "g") { chord = Date.now(); return; }
  if (e.key === "/") { e.preventDefault(); focusSearch(); return; }
  if (k === "n") { e.preventDefault(); editor(null); return; }
  if (view === "terminal") { djKey(e, k); return; }
  if (view === "aplus" && aq.length) {
    if (e.code === "Space") { e.preventDefault(); aReveal(); } else if ("1234".includes(e.key)) aGrade(+e.key);
    return;
  }
  if (view !== "review" || !queue.length) return;
  if (e.code === "Space") { e.preventDefault(); reveal(); }
  else if ("1234".includes(e.key)) grade(+e.key);
  else if (k === "p") play(queue[0]);
});

// ---- Phrases ----
let deck = ls.get("nc-deck") || "", search = "", cards = [];
function renderPhrases() {
  const decks = summary.decks, total = decks.reduce((a, d) => a + d.count, 0);
  $("#main").innerHTML = `
    <div class="phrases">
      <aside class="glass" aria-label="Decks">
        <h4>Decks</h4>
        <button class="deck ${deck === "" ? "on" : ""}" data-d="" aria-pressed="${deck === ""}"><span class="name">All phrases</span><span class="num">${total}</span></button>
        ${decks.map((d) => `
          <button class="deck ${deck === d.id ? "on" : ""}" data-d="${esc(d.id)}" aria-pressed="${deck === d.id}" aria-label="${esc(d.title)}, ${d.started} of ${d.count} started">
            <span><span class="name">${esc(d.title)}</span> <span class="zhn">${esc(d.hanzi)}</span></span><span class="num">${d.started}/${d.count}</span>
            <span class="bar"><i style="width:${Math.round(100 * d.started / d.count)}%"></i></span>
          </button>`).join("")}
      </aside>
      <section>
        <div class="toolbar">
          <input id="q" type="search" placeholder="Search Chinese, pinyin or English…  ( / )" aria-label="Search phrases" value="${esc(search)}">
          <span class="tag" id="count" aria-live="polite"></span>
          <button class="btn" id="add" title="Add a phrase (N)">＋ Add a phrase</button>
        </div>
        <div class="cards" id="list"></div>
      </section>
    </div>`;
  document.querySelectorAll(".deck").forEach((el) => el.onclick = () => { deck = el.dataset.d; ls.set("nc-deck", deck); watch(renderPhrases()); });
  let timer; $("#q").oninput = () => { clearTimeout(timer); timer = setTimeout(() => { search = $("#q").value; watch(loadList()); }, 200); };
  $("#add").onclick = () => editor(null);
  report(null, false, 0);
  return loadList();
}
const skeleton = () => Array.from({ length: 6 }, () => `<div class="pc skel" aria-hidden="true"><i></i><i></i><i></i></div>`).join("");
// keep: reload quietly in place (after an edit), without the shimmer and without losing the scroll position.
async function loadList(keep) {
  const my = loadList.n = (loadList.n || 0) + 1;
  if (!keep) { $("#list").innerHTML = skeleton(); $("#list").setAttribute("aria-busy", "true"); $("#count").textContent = "Loading…"; }
  const y = window.scrollY;
  const got = await api(`/api/cards?deck=${encodeURIComponent(deck)}&q=${encodeURIComponent(search)}`);
  if (my !== loadList.n || view !== "phrases" || !$("#list")) return; // a newer search or another tab won
  cards = got;
  const q = search.trim().toLowerCase();
  $("#count").textContent = `${cards.length} phrase${cards.length === 1 ? "" : "s"}`;
  $("#list").removeAttribute("aria-busy");
  $("#list").innerHTML = cards.length ? cards.map((c, i) => `
    <div class="pc">
      <div class="h zh" lang="zh-CN">${hl(c.hanzi, q)}</div>
      <div class="p">${tonePinyin(c.pinyin, q)}</div>
      <div class="e">${hl(c.english, q)}</div>
      <div class="foot">
        <span class="tag">${esc(deckName(c.deck))}${c.known ? ` · <span class="known">known ✓</span>` : c.isNew ? " · new" : ""}</span>
        <button class="icon" data-play="${i}" title="Play" aria-label="Play ${esc(c.hanzi)}">🔊</button><button class="icon" data-edit="${i}" data-id="${esc(c.id)}" title="Edit" aria-label="Edit ${esc(c.hanzi)}">✎</button>
      </div>
    </div>`).join("") : emptyState(q);
  document.querySelectorAll("[data-play]").forEach((b) => b.onclick = () => play(cards[+b.dataset.play]));
  document.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => editor(cards[+b.dataset.edit]));
  $("#eadd")?.addEventListener("click", () => editor(null));
  $("#eclear")?.addEventListener("click", () => { search = ""; $("#q").value = ""; watch(loadList()); $("#q").focus(); });
  if (keep) window.scrollTo(0, y);
}
function emptyState(q) {
  const name = deck ? deckName(deck) : "your phrases";
  if (q) return `<div class="empty"><div class="big">🔍</div><h3>No match for “${esc(search.trim())}”</h3>
    <p>Nothing in ${esc(name)} has that in the Chinese, pinyin or English.</p><button class="btn ghost" id="eclear">Clear the search</button></div>`;
  if (deck === "mine" || !deck) return `<div class="empty"><div class="big">我的</div><h3>Your own phrases live here</h3>
    <p>Something you heard, or want to say next time? Add it and it's first in line for review.</p><button class="btn" id="eadd">＋ Add a phrase <kbd>N</kbd></button></div>`;
  return `<div class="empty"><div class="big">✦</div><h3>${esc(name)} is empty</h3><p>Pick another deck on the left.</p></div>`;
}
function editor(c) {
  const v = dialog(`
      <h3 id="etitle">${c ? "Edit phrase" : "Add a phrase · 加一句"}</h3>
      <label for="eh">Chinese</label><input id="eh" class="zh" lang="zh-CN" value="${esc(c?.hanzi)}" ${c && !c.custom ? "disabled title='Starter phrases keep their characters'" : ""}>
      <label for="ep">Pinyin <span class="tag">(filled in for you)</span></label><input id="ep" value="${esc(c?.pinyin)}">

function spent(ms) { const s = Math.max(1, Math.round(ms / 1000)); return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min${s % 60 ? ` ${s % 60} s` : ""}`; }

// ---- Couch speaking check: the phone listened; colour each character and count a clean one as Good ----
let said = null, autoGrade = null;
function heard(level, marks) {
  if (!queue.length) return;
  said = { level, marks };
  clearTimeout(autoGrade);
  if (!shown) { shown = true; play(queue[0]); }
  drawCard(true);
  if (level === 2) autoGrade = setTimeout(() => { if (said) grade(3); }, 1600);
}
function saidStrip(c) {
  if (!said) return "";
  if (said.marks === "quiet") return `<div class="said miss">Didn't catch that. Try again a little louder.</div>`;
  let k = 0;
  const chars = [...c.hanzi].map((ch) => /[一-鿿]/.test(ch) ? `<span class="m${said.marks[k++] || "M"}">${esc(ch)}</span>` : esc(ch)).join("");
  const label = ["Not quite. Listen and try again", "Close!", "Perfect! Counting it as Good"][said.level];
  return `<div class="said lvl${said.level}"><div class="chars">${chars}</div><div>🎤 ${label}</div></div>`;
}
function reveal() { if (shown || !queue.length) return; shown = true; drawCard(true); play(queue[0]); }
// The card only moves on once the phone has saved the grade; if that fails, it stays so you can grade again.
async function grade(g) {
  if (!shown || !queue.length || busy) return;
  const c = queue[0]; busy = true; clearTimeout(autoGrade);

  catch (e) { toast(e.quiet ? "Not saved: the phone isn't reachable. The card stays; grade it again in a moment." : `Not saved: ${e.message}`, true); return; }
  finally { busy = false; }
  if (queue[0] !== c) return;
  queue.shift(); shown = false; said = null;
  if (sess) { sess.ids.add(c.id); if (g === 1) sess.again++; sess.t1 = Date.now(); }
  if (g === 1) queue.push(c); // missed: once more before you're done
  if (view === "review") drawCard();
  refreshSummary().catch(() => {});
}

// ---- Sky: every phrase you know is a star; a deck you know completely becomes a constellation ----
let skyTimer = null;
function hash(str) { let h = 2166136261; for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rand(seed) { return () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; }; }
async function renderSky() {
  const all = await api("/api/cards");
  if (view !== "sky") return;
  $("#main").innerHTML = `<div class="sky"><canvas id="skyc" role="img" aria-label="Your sky: each phrase you've started is a star"></canvas><div class="tip" id="tip"></div>
    <div class="legend" id="legend"></div></div>`;
  const cv = $("#skyc"), ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  // Each deck gets its own patch of sky, on a wide ellipse; its cards scatter around that spot.
  const decks = summary.decks.filter((d) => all.some((c) => c.deck === d.id));
  const stars = [], groups = [];
  decks.forEach((d, i) => {
    const a = (i / decks.length) * Math.PI * 2 - Math.PI / 2;
    const cx = W / 2 + Math.cos(a) * W * 0.38, cy = H / 2 - 10 + Math.sin(a) * H * 0.30;
    const mine = all.filter((c) => c.deck === d.id && !c.isNew);
    const pts = mine.map((c) => {
      const r = rand(hash(c.id)), ang = r() * Math.PI * 2, dist = Math.sqrt(r()) * Math.min(W, H) * 0.10;
      const s = { x: cx + Math.cos(ang) * dist, y: cy + Math.sin(ang) * dist, c, known: c.known, size: c.known ? 1.6 + r() * 1.4 : 0.9, phase: r() * 6.28 };
      stars.push(s); return s;
    });
    const total = all.filter((c) => c.deck === d.id).length;
    const complete = total > 0 && all.filter((c) => c.deck === d.id).every((c) => c.known);
    groups.push({ d, cx, cy, pts, total, known: mine.filter((c) => c.known).length, complete });
  });
  // Constellation lines: walk each finished deck's stars nearest-first.
  groups.filter((g) => g.complete).forEach((g) => {
    const left = g.pts.slice(), path = [left.shift()];
    while (left.length) { const last = path[path.length - 1]; left.sort((p, q) => (p.x - last.x) ** 2 + (p.y - last.y) ** 2 - ((q.x - last.x) ** 2 + (q.y - last.y) ** 2)); path.push(left.shift()); }
    g.path = path;
  });
  const known = stars.filter((s) => s.known).length;
  $("#legend").innerHTML = `<span style="color:var(--sun)">✦ ${known} star${known === 1 ? "" : "s"} in your sky</span><span>bright = known · faint = still learning · <span style="color:#ffc85a">gold = said for real ★</span></span>
    <span>${groups.filter((g) => g.complete).length} constellation${groups.filter((g) => g.complete).length === 1 ? "" : "s"} (decks you know completely)</span><span>Hover a star to see its phrase</span>`;
  let t = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    groups.forEach((g) => {
      if (g.path) { ctx.strokeStyle = "rgba(255,207,122,.35)"; ctx.lineWidth = 1; ctx.beginPath(); g.path.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); }
      ctx.fillStyle = g.complete ? "rgba(255,207,122,.9)" : "rgba(169,177,214,.55)";
      ctx.font = "600 13px Segoe UI, sans-serif"; ctx.textAlign = "center";
      const ly = Math.min(g.cy + Math.min(W, H) * 0.125, H - 22);
      ctx.fillText(`${g.d.title} ${g.d.hanzi}`, g.cx, ly);
      ctx.font = "11px Segoe UI, sans-serif"; ctx.fillText(`${g.known}/${g.total}`, g.cx, ly + 15);
    });
    stars.forEach((s) => {
      const tw = s.known || s.c.real ? 0.65 + 0.35 * Math.sin(t + s.phase) : 0.35;
      // Said it for real ★: a phrase you actually used with her family glows gold, bigger.
      const rgb = s.c.real ? "255,200,90" : "255,240,210", halo = s.size * (s.c.real ? 6 : 4);
      const grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, halo);
      grd.addColorStop(0, `rgba(${rgb},${tw})`); grd.addColorStop(1, `rgba(${rgb},0)`);
      ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(s.x, s.y, halo, 0, 6.29); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${tw})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.size * 0.7, 0, 6.29); ctx.fill();
    });
  }
  draw();
  if (!calm()) skyTimer = setInterval(() => { t += 0.12; draw(); }, 100); // a calm 10 frames a second (still, with reduced motion)
  const tip = $("#tip");
  cv.onmousemove = (e) => {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 144;
    stars.forEach((s) => { const d = (s.x - x) ** 2 + (s.y - y) ** 2; if (d < bd) { bd = d; best = s; } });
    if (!best) { tip.style.display = "none"; return; }
    tip.innerHTML = `<div class="h">${esc(best.c.hanzi)}</div><div>${tonePinyin(best.c.pinyin)}</div><div class="muted">${esc(best.c.english)}</div>${best.c.real ? `<div style="color:var(--sun)">★ said for real ×${best.c.real}</div>` : ""}`;
    tip.style.display = "block"; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px";
  };
  cv.onmouseleave = () => tip.style.display = "none";
  cv.onclick = (e) => { const r = cv.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top; const s = stars.find((s) => (s.x - x) ** 2 + (s.y - y) ** 2 < 144); if (s) play(s.c); };
  report(null, false, 0);
}

  const best = rushBest(), table = `<details class="peek"><summary>Peek at the port list</summary><div class="ptable">${PORTS.map((p) => `<span><b>${esc(p[0])}</b> ${esc(portText(p).replace(/ · /g, ", "))}</span>`).join("")}</div></details>`;
  if (R.on) return `<div class="rush glass" id="rcard">
      <div class="rhud"><span>Score <b id="rscore">0</b></span><span class="pill sun" id="rcombo">×1</span><span><b id="rsec">60</b> s left</span></div>
      <div class="rtime" aria-hidden="true"><i id="rbar"></i></div>
      <div class="proto" id="rproto" aria-live="polite"></div><div class="muted" id="rdesc"></div>
      <input id="rin" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Port number" placeholder="port">
      <div class="rfb" id="rfb" aria-live="polite"></div>
      <p class="tag">A right answer counts the moment it's complete. Enter on an empty box skips. Every 3 in a row raises the multiplier.</p></div>`;
  if (R.ended) {
    const acc = Math.round(100 * R.right / Math.max(1, R.right + R.wrong));
    return `<div class="rush glass" role="status">
      <div class="tag" style="letter-spacing:1.5px;text-transform:uppercase">Time!</div>
      <div class="bigscore">${R.score}</div>${R.newBest ? `<div class="best">New best ✦</div>` : `<div class="muted">Best: ${best}</div>`}
      <div class="sumgrid" style="margin:18px auto 10px"><div><b class="t3">${R.right}</b><span>right</span></div><div><b>${R.maxCombo}</b><span>best combo</span></div><div><b>${acc}%</b><span>accuracy</span></div></div>
      ${R.miss.length ? `<p class="muted" style="margin:10px 0 0">Worth another look:</p><div class="misses">${R.miss.map((p) => `<span><b>${esc(p[0])}</b> ${esc(portText(p))}</span>`).join("")}</div>`
        : `<p class="muted">Not a single miss. Lovely.</p>`}
      <div class="drow" style="justify-content:center;margin-top:16px"><button class="btn" id="rgo">Play again <kbd>Enter</kbd></button></div>${table}</div>`;
  }
  return `<div class="rush glass">
      <div style="font-size:40px;color:var(--sun)">⚡</div><h2 style="margin:4px 0">Port Rush</h2>
      <p class="muted" style="max-width:480px;margin:6px auto">A protocol flashes; type its port number. 60 seconds. Streaks multiply your points, and anything you miss comes back a few turns later.
      For protocols with more than one port (FTP, DHCP, NetBIOS, SNMP), any of them counts.</p>
      ${best ? `<div class="muted">Your best: <b style="color:var(--sun)">${best}</b></div>` : ""}
      <div class="drow" style="justify-content:center;margin-top:16px"><button class="btn" id="rgo">Start <kbd>Enter</kbd></button></div>${table}</div>`;
}

// ---- The tab ----
function renderDojo() {
  $("#main").innerHTML = `<div class="dojo">
    <div class="dtop"><div class="seg" role="group" aria-label="Dojo mode"><button data-m="cases">Tickets</button><button data-m="rush">Port Rush ⚡</button></div>
      <span class="tag">A pretend Windows PC: nothing here runs on your computer.</span><div class="dprog" id="dprog"></div></div>
    <div id="dbody"></div></div>`;
  document.querySelectorAll("[data-m]").forEach((b) => b.onclick = () => { if (dj.mode === b.dataset.m) return; djStop(); dj.mode = b.dataset.m; djSave(); djBody(); });
  djBody();
  report(null, false, 0);
}
function djBody() {
  const body = $("#dbody"); if (!body) return;
  document.querySelectorAll("[data-m]").forEach((b) => { b.classList.toggle("on", b.dataset.m === dj.mode); b.setAttribute("aria-pressed", b.dataset.m === dj.mode); });
  if (dj.mode === "rush") {
    body.innerHTML = rushScreen(); djPicker();
    $("#rgo")?.addEventListener("click", rushStart);
    $("#rgo")?.focus({ preventScroll: true });            // so Enter starts (or replays) right away
    const inp = $("#rin");
    if (inp) {
      inp.oninput = () => { const v = inp.value.trim(); if (/^\d+$/.test(v) && R.cur?.[2].includes(+v)) rushAnswer(v); };
      inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); rushAnswer(inp.value.trim(), !inp.value.trim()); } };
    }
    return;
  }
  body.innerHTML = `<div class="picker" id="picker" aria-label="Tickets"></div>
    <div class="dwork">
      <div class="term" id="term">
        <div class="tbar"><span class="tab"><b>&gt;_</b> Administrator: Command Prompt</span><span class="win" aria-hidden="true">─▢✕</span></div>
        <div class="tout" id="tout" role="log" aria-label="Terminal output"><div id="tlog"></div><div class="tline" id="tline"></div></div>
        <input class="tin" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type a command">
      </div>
      <section class="glass ticket" id="ticket" aria-live="polite"></section>
    </div>`;
  const inp = $("#tin"), term = $("#term");
  inp.onkeydown = tKey;
  inp.oninput = tLine; inp.onselect = tLine;
  inp.onfocus = () => { term.classList.add("focus"); tLine(); };
  inp.onblur = () => { term.classList.remove("focus"); tLine(); };
  $("#tout").onclick = () => { if (!String(getSelection())) inp.focus(); };
  if (T.pc && T.sid === dj.cur && T.saved) {                  // back from another tab: the terminal is where you left it
    $("#tlog").innerHTML = T.saved; djPicker(); djPanel(); tLine(); tScroll();
  } else djStart(dj.cur || SC[0].id, false);
}
// Leaving the tab (or switching mode): stop the clock and any output still printing, and keep the screen for later.
function djStop() {
  if ($("#tlog")) T.saved = $("#tlog").innerHTML;
  if (T.busy) { T.gen++; T.busy = false; T.ask = null; }
  if (R.on) { clearInterval(R.timer); R.on = false; R.ended = false; }
}
function djKey(e, k) {
  if (e.key === "Enter" && e.target.closest?.("button, a, summary")) return;   // Enter on a focused button presses it
  if (dj.mode === "rush") {
    if (e.key === "Enter") { e.preventDefault(); if (R.on) $("#rin")?.focus(); else rushStart(); }
    return;
  }
  if (e.key === "Enter") { e.preventDefault(); $("#tin")?.focus(); }
  else if ("1234".includes(e.key) && e.key) djChoose(+e.key - 1);
  else if (k === "h") djHint();
}

// ---- Phone remote: the page waits for presses (long-poll) and acts on them ----
let listening = false;
async function listen() {
  if (listening) return; listening = true;
  const pause = () => new Promise((ok) => setTimeout(ok, 3000));
  let last = -1;
  while (token) { try { last = (await api("/api/remote?after=-1")).last; break; } catch { await pause(); } }
  while (token) {
    try {
      const r = await api(`/api/remote?after=${last}`);
      last = r.last;
      for (const c of r.cmds) act(c);
    } catch { await pause(); }
  }
  listening = false;
}
function act(c) {
  const dot = $("#rdot"); if (dot) { dot.style.display = "inline-block"; clearTimeout(act.t); act.t = setTimeout(() => dot.style.display = "none", 60000); }
  const behavior = calm() ? "auto" : "smooth";
  if (c.cmd === "tab") return go(VIEWS[c.value] || "phrases");
  if (c.cmd === "scroll") return window.scrollBy({ top: c.value, behavior });
  if (c.cmd === "top") return window.scrollTo({ top: 0, behavior });
  if (view === "aplus") { if (c.cmd === "show") aReveal(); else if (c.cmd === "grade") aGrade(c.value); return; }
  // In the dojo the phone's Show button gives a hint and its four grade buttons pick answer 1–4 (never yanks you to Review).
  if (view === "terminal") { if (c.cmd === "show") djHint(); else if (c.cmd === "grade") djChoose(c.value - 1); return; }
  if (view !== "review") { if (c.cmd === "show" || c.cmd === "grade") go("review"); return; }
  if (c.cmd === "said") return heard(c.value, c.text);
  if (c.cmd === "show") reveal();
  else if (c.cmd === "grade") grade(c.value);
  else if (c.cmd === "play") play(queue[0]);
}

if (token) start(); else showPair();
