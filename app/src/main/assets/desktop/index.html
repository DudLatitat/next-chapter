<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next Chapter · 新篇章</title>
<style>
  /* Served by the phone over your home Wi-Fi. Nothing here loads from the internet. */
  :root {
    --ground: #0b1129; --ground2: #17214a; --card: rgba(29, 40, 86, .78); --line: rgba(255, 255, 255, .07);
    --ink: #eef1ff; --muted: #a9b1d6; --sun: #ffcf7a; --rose: #ff8fb1; --jade: #4fb3a9; --violet: #8e94f2; --coral: #ff6b6b;
    --zh: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); overflow-x: hidden;
    font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1400px 800px at 75% -15%, #2c4280 0%, var(--ground2) 42%, var(--ground) 100%) fixed;
  }
  /* A quiet sky: two layers of tiny stars. */
  body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; }
  body::before {
    background-image:
      radial-gradient(1.2px 1.2px at 12% 18%, #fff8, transparent), radial-gradient(1px 1px at 33% 72%, #fff6, transparent),
      radial-gradient(1.4px 1.4px at 58% 12%, #fff9, transparent), radial-gradient(1px 1px at 81% 44%, #fff6, transparent),
      radial-gradient(1.2px 1.2px at 91% 82%, #fff7, transparent), radial-gradient(1px 1px at 22% 91%, #fff5, transparent),
      radial-gradient(1.3px 1.3px at 67% 63%, #fff6, transparent), radial-gradient(1px 1px at 45% 35%, #fff4, transparent);
    animation: twinkle 7s ease-in-out infinite alternate;
  }
  body::after {
    background-image:
      radial-gradient(1px 1px at 8% 55%, #fff5, transparent), radial-gradient(1.3px 1.3px at 28% 8%, #fff7, transparent),
      radial-gradient(1px 1px at 52% 88%, #fff5, transparent), radial-gradient(1.2px 1.2px at 73% 25%, #fff6, transparent),
      radial-gradient(1px 1px at 95% 10%, #fff5, transparent), radial-gradient(1.2px 1.2px at 38% 52%, #fff4, transparent);
    animation: twinkle 9s ease-in-out infinite alternate-reverse;
  }
  @keyframes twinkle { from { opacity: .45; } to { opacity: 1; } }

  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 20px; padding: 14px 28px;
           background: linear-gradient(to bottom, rgba(11, 17, 41, .92), rgba(11, 17, 41, .6)); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .zh { font: 700 22px var(--zh); color: var(--sun); }
  .brand .en { font-weight: 600; color: var(--ink); letter-spacing: .3px; }
  nav { display: flex; gap: 4px; background: rgba(255,255,255,.05); padding: 4px; border-radius: 999px; }
  nav button { background: none; border: 0; color: var(--muted); font: inherit; font-weight: 600; padding: 7px 18px; border-radius: 999px; cursor: pointer; transition: .2s; }
  nav button:hover { color: var(--ink); }
  nav button.on { background: var(--sun); color: #1a1f3d; }
  .stats { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .pill { padding: 5px 12px; border-radius: 999px; background: rgba(142, 148, 242, .16); color: #c5c9ff; font-size: 13px; }
  .pill.sun { background: rgba(255, 207, 122, .16); color: var(--sun); }
  .remote-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--jade); box-shadow: 0 0 10px var(--jade); display: none; }

  .glass { background: var(--card); border: 1px solid var(--line); border-radius: 22px; backdrop-filter: blur(6px); box-shadow: 0 20px 50px -30px #000a; }
  .muted { color: var(--muted); }
  .tag { font-size: 12px; color: var(--muted); }
  .zh { font-family: var(--zh); }
  button { font: inherit; }
  .btn { border: 0; border-radius: 14px; padding: 10px 18px; cursor: pointer; color: #141a3a; background: var(--sun); font-weight: 600; transition: transform .12s, filter .2s; }
  .btn:hover { filter: brightness(1.08); } .btn:active { transform: scale(.97); }
  .btn.ghost { background: rgba(255,255,255,.06); color: var(--ink); border: 1px solid var(--line); }
  input { font: inherit; color: var(--ink); background: rgba(9, 14, 36, .65); border: 1px solid rgba(255, 255, 255, .12); border-radius: 12px; padding: 10px 13px; transition: border-color .2s; }
  input:focus { outline: none; border-color: var(--sun); }
  kbd { font: 11px ui-monospace, monospace; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.18); border: 1px solid rgba(255,255,255,.25); }
  .t1 { color: var(--coral); } .t2 { color: var(--sun); } .t3 { color: var(--jade); } .t4 { color: var(--violet); } .t5 { color: var(--muted); }

  /* ---- Phrases ---- */
  .phrases { display: grid; grid-template-columns: 250px 1fr; gap: 22px; max-width: 1280px; margin: 0 auto; padding: 22px 28px 60px; }
  aside { position: sticky; top: 84px; align-self: start; max-height: calc(100vh - 100px); overflow: auto; padding: 14px; }
  aside h4 { margin: 4px 8px 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }
  .deck { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; padding: 9px 11px; border-radius: 13px; cursor: pointer; transition: background .15s; }
  .deck:hover { background: rgba(255,255,255,.05); }
  .deck.on { background: rgba(255, 207, 122, .12); box-shadow: inset 3px 0 0 var(--sun); }
  .deck .name { font-weight: 600; } .deck .zhn { font: 13px var(--zh); color: var(--sun); }
  .deck .num { font-size: 12px; color: var(--muted); grid-row: span 2; }
  .deck .bar { grid-column: span 2; height: 4px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; }
  .deck .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--jade), #7ed6c9); }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  .toolbar input { flex: 1; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .pc { position: relative; padding: 18px 18px 14px; border-radius: 18px; background: rgba(29, 40, 86, .62); border: 1px solid var(--line); transition: transform .15s, border-color .2s; }
  .pc:hover { transform: translateY(-2px); border-color: rgba(255, 207, 122, .35); }
  .pc .h { font: 28px/1.25 var(--zh); letter-spacing: 1px; }
  .pc .p { font-size: 15px; margin-top: 2px; }
  .pc .e { margin-top: 6px; }
  .pc .foot { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .pc .foot .tag { flex: 1; }
  .icon { border: 0; background: rgba(255,255,255,.06); color: var(--ink); width: 32px; height: 32px; border-radius: 10px; cursor: pointer; }
  .icon:hover { background: rgba(255,255,255,.12); }
  .known { color: var(--jade); }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }

  /* ---- Review ---- */
  .review { max-width: 860px; margin: 0 auto; padding: 34px 28px 60px; }
  .progress { height: 6px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; margin-bottom: 18px; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--sun), var(--rose)); transition: width .4s; }
  .flash { perspective: 1400px; }
  .face { min-height: 330px; padding: 40px 44px; display: flex; flex-direction: column; justify-content: center; transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  .face.flip { animation: flip .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(12deg) scale(.98); opacity: .6; } 100% { transform: rotateX(0); } }
  .face .english { font-size: 30px; font-weight: 600; }
  .face .hanzi { font: 76px/1.2 var(--zh); letter-spacing: 6px; margin-top: 18px; }
  .face .pinyin { font-size: 26px; margin-top: 4px; }
  .grades { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 10px; margin-top: 18px; }
  .grades .btn { padding: 14px 10px; }
  .g1 { background: var(--coral); } .g2 { background: var(--sun); } .g3 { background: var(--jade); } .g4 { background: var(--violet); }
  .hint { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }

  /* ---- Dialog, toast ---- */
  .veil { position: fixed; inset: 0; background: rgba(5, 8, 20, .6); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 20; animation: fade .15s; }
  @keyframes fade { from { opacity: 0; } }
  .dialog { width: min(520px, 92vw); padding: 26px; }
  .dialog h3 { margin: 0 0 14px; }
  .dialog label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  .dialog input { width: 100%; }
  .dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .toast { position: fixed; bottom: 26px; left: 50%; transform: translate(-50%, 20px); background: #222d5e; border: 1px solid var(--line); padding: 11px 20px; border-radius: 14px; opacity: 0; transition: .3s; z-index: 30; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .pair { max-width: 440px; margin: 14vh auto; text-align: center; padding: 34px; }
  .pair input { font-size: 34px; letter-spacing: 12px; width: 270px; text-align: center; margin: 10px 0; }

  @media (max-width: 820px) {
    .phrases { grid-template-columns: 1fr; padding: 16px; } aside { position: static; max-height: none; }
    header { flex-wrap: wrap; padding: 12px 16px; } .stats { margin-left: 0; }
    .face { padding: 28px; } .face .hanzi { font-size: 52px; } .grades { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
let token = localStorage.getItem("nc-token") || "";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json", "X-Token": token }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401 && !path.startsWith("/api/pair")) { token = ""; localStorage.removeItem("nc-token"); showPair(); throw new Error("not paired"); }
  return r.json();
}
function toast(text) { const t = $("#toast"); t.textContent = text; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800); }
function play(card) { if (card) new Audio(`/voice/${card.voice}.mp3?t=${encodeURIComponent(token)}`).play().catch(() => {}); }

// Pinyin coloured by tone, like the app (1 coral, 2 gold, 3 jade, 4 violet, neutral grey).
const MARKS = { 1: "āēīōūǖ", 2: "áéíóúǘ", 3: "ǎěǐǒǔǚ", 4: "àèìòùǜ" };
function toneOf(syl) { for (const t of [1, 2, 3, 4]) if ([...syl].some((ch) => MARKS[t].includes(ch))) return t; return 5; }
// Split "yìqǐ" into syllables so each one gets its own colour.
const V = "aeiouüvāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ";
const SYL = new RegExp(`(?:[zcs]h|[bpmfdtnlgkhjqxzcsrwy])?[${V}]+(?:ng(?![${V}])|n(?![${V}])|r(?![${V}]))?`, "gi");
function tonePinyin(p) {
  return esc(p).replace(SYL, (syl) => `<span class="t${toneOf(syl)}">${syl}</span>`);
}

// ---- Pairing ----
function showPair(message) {
  $("#app").innerHTML = `
    <div class="pair glass">
      <div class="zh" style="font-size:30px;color:var(--sun)">新篇章</div>
      <h2 style="margin:4px 0 6px">Next Chapter</h2>
      <p class="muted">Type the 6-digit code from your phone<br>(Settings → Use on my computer). Only once.</p>
      <input id="code" inputmode="numeric" maxlength="6" autofocus autocomplete="off">
      <p style="color:var(--coral);min-height:1.5em">${esc(message || "")}</p>
      <button class="btn" id="go">Connect</button>
    </div>`;
  const go = async () => {
    const r = await api("/api/pair", { code: $("#code").value });
    if (r.token) { token = r.token; localStorage.setItem("nc-token", token); start(); } else showPair(r.message);
  };
  $("#go").onclick = go; $("#code").onkeydown = (e) => { if (e.key === "Enter") go(); };
}

// ---- Shell ----
let view = "phrases", summary = null;
const deckName = (id) => (summary?.decks.find((d) => d.id === id) || {}).title || id;
async function start() {
  try { summary = await api("/api/summary"); } catch { return; }
  $("#app").innerHTML = `
    <header>
      <div class="brand"><span class="zh">新篇章</span><span class="en">Next Chapter</span></div>
      <nav><button data-v="phrases">Phrases</button><button data-v="review">Review</button></nav>
      <div class="stats"><span class="remote-dot" id="rdot" title="Phone remote connected"></span><span id="stats"></span></div>
    </header>
    <div id="main"></div>`;
  document.querySelectorAll("nav button").forEach((b) => b.onclick = () => go(b.dataset.v));
  go(view);
  listen();
}
function go(v) { view = v; document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.v === view)); renderStats(); (view === "review" ? renderReview : renderPhrases)(); }
function renderStats() {
  const due = summary.due + summary.fresh;
  $("#stats").innerHTML = `<span class="pill sun">🔥 ${summary.streak}-day streak</span> <span class="pill">${summary.known} known</span> ${due ? `<span class="pill">${due} to review</span>` : ""}`;
}
async function refreshSummary() { summary = await api("/api/summary"); renderStats(); }

// Tell the phone remote what's on screen.
function report(card, shown, left) {
  api("/api/state", { view, english: card?.english || "", hanzi: card?.hanzi || "", pinyin: card?.pinyin || "", shown: !!shown, left: left || 0 }).catch(() => {});
}

// ---- Phrases ----
let deck = "", search = "", cards = [];
function renderPhrases() {
  const decks = summary.decks, total = decks.reduce((a, d) => a + d.count, 0);
  $("#main").innerHTML = `
    <div class="phrases">
      <aside class="glass">
        <h4>Decks</h4>
        <div class="deck ${deck === "" ? "on" : ""}" data-d=""><span class="name">All phrases</span><span class="num">${total}</span></div>
        ${decks.map((d) => `
          <div class="deck ${deck === d.id ? "on" : ""}" data-d="${esc(d.id)}">
            <span><span class="name">${esc(d.title)}</span> <span class="zhn">${esc(d.hanzi)}</span></span><span class="num">${d.started}/${d.count}</span>
            <span class="bar"><i style="width:${Math.round(100 * d.started / d.count)}%"></i></span>
          </div>`).join("")}
      </aside>
      <section>
        <div class="toolbar">
          <input id="q" placeholder="Search Chinese, pinyin or English…" value="${esc(search)}">
          <span class="tag" id="count"></span>
          <button class="btn" id="add">＋ Add a phrase</button>
        </div>
        <div class="cards" id="list"></div>
      </section>
    </div>`;
  document.querySelectorAll(".deck").forEach((el) => el.onclick = () => { deck = el.dataset.d; renderPhrases(); });
  let timer; $("#q").oninput = () => { clearTimeout(timer); timer = setTimeout(() => { search = $("#q").value; loadList(); }, 200); };
  $("#add").onclick = () => editor(null);
  report(null, false, 0);
  loadList();
}
async function loadList() {
  cards = await api(`/api/cards?deck=${encodeURIComponent(deck)}&q=${encodeURIComponent(search)}`);
  $("#count").textContent = `${cards.length} phrase${cards.length === 1 ? "" : "s"}`;
  $("#list").innerHTML = cards.length ? cards.map((c, i) => `
    <div class="pc">
      <div class="h">${esc(c.hanzi)}</div>
      <div class="p">${tonePinyin(c.pinyin)}</div>
      <div class="e">${esc(c.english)}</div>
      <div class="foot">
        <span class="tag">${esc(deckName(c.deck))}${c.known ? ` · <span class="known">known ✓</span>` : c.isNew ? " · new" : ""}</span>
        <button class="icon" data-play="${i}" title="Play">🔊</button><button class="icon" data-edit="${i}" title="Edit">✎</button>
      </div>
    </div>`).join("") : `<div class="empty">Nothing here yet. ${search ? "Try another search." : ""}</div>`;
  document.querySelectorAll("[data-play]").forEach((b) => b.onclick = () => play(cards[+b.dataset.play]));
  document.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => editor(cards[+b.dataset.edit]));
}
function editor(c) {
  const v = document.createElement("div"); v.className = "veil";
  v.innerHTML = `
    <div class="dialog glass">
      <h3>${c ? "Edit phrase" : "Add a phrase · 加一句"}</h3>
      <label>Chinese</label><input id="eh" class="zh" value="${esc(c?.hanzi)}" ${c && !c.custom ? "disabled title='Starter phrases keep their characters'" : ""}>
      <label>Pinyin <span class="tag">(filled in for you)</span></label><input id="ep" value="${esc(c?.pinyin)}">
      <label>What it means</label><input id="ee" value="${esc(c?.english)}">
      ${c ? "" : `<p class="tag">It goes into My phrases, first in line for review.</p>`}
      <div class="row">
        ${c?.custom ? `<button class="btn ghost" id="del" style="color:var(--coral);margin-right:auto">Delete</button>` : ""}
        <button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="save">${c ? "Save" : "Add"}</button>
      </div>
    </div>`;
  document.body.appendChild(v);
  const close = () => v.remove();
  v.onclick = (e) => { if (e.target === v) close(); };
  v.onkeydown = (e) => { if (e.key === "Escape") close(); if (e.key === "Enter") $("#save").click(); };
  (c && !c.custom ? $("#ep") : $("#eh")).focus();
  $("#eh").onblur = async () => { if ($("#eh").value && !$("#ep").value) $("#ep").value = (await api(`/api/pinyin?h=${encodeURIComponent($("#eh").value)}`)).pinyin; };
  $("#cancel").onclick = close;
  $("#save").onclick = async () => {
    if (!c && !$("#eh").value.trim()) return toast("Type the Chinese first");
    await api("/api/card", { id: c?.id ?? null, hanzi: $("#eh").value, pinyin: $("#ep").value, english: $("#ee").value });
    close(); toast(c ? "Saved" : "Added 💛"); await refreshSummary(); if (c) loadList(); else renderPhrases();
  };
  if (c?.custom) $("#del").onclick = async () => { if (confirm(`Delete ${c.hanzi}?`)) { await api("/api/delete", { id: c.id }); close(); toast("Deleted"); await refreshSummary(); renderPhrases(); } };
}

// ---- Review: Space shows, 1–4 grade, P plays (or the phone remote) ----
let queue = [], shown = false, startSize = 0;
async function renderReview() { queue = await api("/api/queue"); startSize = queue.length; shown = false; drawCard(); }
function drawCard(flip) {
  const c = queue[0];
  if (!c) {
    $("#main").innerHTML = `<div class="review"><div class="glass face" style="text-align:center"><div style="font-size:54px">✓</div>
      <h2 style="margin:6px 0">All caught up · 都复习完了</h2><p class="muted">New phrases arrive tomorrow. Add your own under Phrases.</p></div></div>`;
    report(null, false, 0); return;
  }
  const done = startSize ? Math.min(1, (startSize - queue.length) / startSize) : 0;
  $("#main").innerHTML = `
    <div class="review">
      <div class="row" style="display:flex;justify-content:space-between" ><span class="muted">${queue.length} to go</span><span class="tag">${c.isNew ? "new" : "review"} · ${esc(deckName(c.deck))}</span></div>
      <div class="progress"><i style="width:${Math.round(done * 100)}%"></i></div>
      <div class="flash"><div class="glass face ${flip ? "flip" : ""}">
        <div class="english">${esc(c.english)}</div>
        ${shown ? `<div class="hanzi zh">${esc(c.hanzi)}</div><div class="pinyin">${tonePinyin(c.pinyin)}</div>`
                : `<p class="muted" style="margin-top:14px">Say it out loud in Chinese, then show the answer.</p>`}
      </div></div>
      ${shown
        ? `<div class="grades"><button class="btn g1" data-g="1">Again <kbd>1</kbd></button><button class="btn g2" data-g="2">Hard <kbd>2</kbd></button>
           <button class="btn g3" data-g="3">Good <kbd>3</kbd></button><button class="btn g4" data-g="4">Easy <kbd>4</kbd></button><button class="btn ghost" id="play">🔊 <kbd>P</kbd></button></div>`
        : `<div class="grades" style="grid-template-columns:1fr"><button class="btn" id="show">Show answer <kbd>Space</kbd></button></div>`}
      <div class="hint">Keyboard: Space · 1–4 · P &nbsp;·&nbsp; or use your phone as a remote</div>
    </div>`;
  if (!shown) $("#show").onclick = reveal;
  else { document.querySelectorAll("[data-g]").forEach((b) => b.onclick = () => grade(+b.dataset.g)); $("#play").onclick = () => play(c); }
  report(c, shown, queue.length);
}
function reveal() { if (shown || !queue.length) return; shown = true; drawCard(true); play(queue[0]); }
async function grade(g) {
  if (!shown || !queue.length) return;
  const c = queue.shift(); shown = false;
  await api("/api/grade", { id: c.id, grade: g });
  if (g === 1) queue.push(c); // missed: once more before you're done
  await refreshSummary(); drawCard();
}
document.addEventListener("keydown", (e) => {
  if (view !== "review" || !queue.length || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); reveal(); }
  else if ("1234".includes(e.key)) grade(+e.key);
  else if (e.key.toLowerCase() === "p") play(queue[0]);
});

// ---- Phone remote: the page waits for presses (long-poll) and acts on them ----
async function listen() {
  let last = -1;
  try { last = (await api("/api/remote?after=-1")).last; } catch { return; }
  for (;;) {
    try {
      const r = await api(`/api/remote?after=${last}`);
      last = r.last;
      for (const c of r.cmds) act(c);
    } catch { await new Promise((ok) => setTimeout(ok, 3000)); }
  }
}
function act(c) {
  const dot = $("#rdot"); if (dot) { dot.style.display = "inline-block"; clearTimeout(act.t); act.t = setTimeout(() => dot.style.display = "none", 60000); }
  if (c.cmd === "tab") return go(c.value === 1 ? "review" : "phrases");
  if (c.cmd === "scroll") return window.scrollBy({ top: c.value, behavior: "smooth" });
  if (c.cmd === "top") return window.scrollTo({ top: 0, behavior: "smooth" });
  if (view !== "review") { if (c.cmd === "show" || c.cmd === "grade") go("review"); return; }
  if (c.cmd === "show") reveal();
  else if (c.cmd === "grade") grade(c.value);
  else if (c.cmd === "play") play(queue[0]);
}

if (token) start(); else showPair();
</script>
