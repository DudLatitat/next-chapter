name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Natural voice for the built-in phrases: recorded once, kept between builds.
      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/voice
          key: voice-xiaoxiao-${{ hashFiles('app/src/main/java/com/dudlatitat/nextchapter/data/*.kt', 'tools/make_voice.py') }}
          restore-keys: voice-xiaoxiao-
      - name: Record phrases
        continue-on-error: true
        run: |
          pip install --quiet edge-tts
          python3 tools/make_voice.py
          ls app/src/main/assets/voice | wc -l
      # Stroke order for handwriting practice (hanzi-writer-data, Arphic Public License).
      - name: Stroke data
        run: |
          mkdir -p /tmp/hw && cd /tmp/hw && npm pack hanzi-writer-data@2.0.1 --silent && tar xzf hanzi-writer-data-*.tgz
          cd "$GITHUB_WORKSPACE" && python3 tools/make_strokes.py /tmp/hw/package
      - name: Unlock signing key
        env:
          NC_KEY_PASSWORD: ${{ secrets.NC_KEY_PASSWORD }}
        run: |
          if [ -z "$NC_KEY_PASSWORD" ]; then
            echo "::error::Add the NC_KEY_PASSWORD secret (Settings → Secrets and variables → Actions)."; exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/next-chapter.jks.enc -out "$RUNNER_TEMP/nc.jks" -pass env:NC_KEY_PASSWORD
      - name: Build
        env:
          NC_KEY_PASSWORD: ${{ secrets.NC_KEY_PASSWORD }}
          NC_KEYSTORE: ${{ runner.temp }}/nc.jks
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build.log
      # Repeat compiler errors as one annotation, readable without the full log.
      - name: Summarise build errors
        if: failure()
        run: |
          errors=$(grep -E "^e: |Error: |What went wrong" -A4 build.log | grep -v "^\s*at " | head -60 || true)
          errors=${errors//'%'/'%25'}
          errors=${errors//$'\n'/'%0A'}
          echo "::error title=Build errors::${errors:-No error lines found; see the full log.}"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk next-chapter-1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: next-chapter-apk
          path: next-chapter-*.apk
      # Newest APK always at the "latest" release, easy to grab on the phone.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest next-chapter-*.apk --title "Next Chapter 1.${{ github.run_number }}" --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7}" --latest
