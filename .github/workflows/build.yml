name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Natural voice for the built-in phrases: recorded once, kept between builds.
      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/voice
          key: voice-xiaoxiao-${{ hashFiles('app/src/main/java/com/dudlatitat/nextchapter/data/*.kt', 'tools/make_voice.py') }}
          restore-keys: voice-xiaoxiao-
      - name: Record phrases
        continue-on-error: true
        run: |
          pip install --quiet edge-tts
          python3 tools/make_voice.py
          ls app/src/main/assets/voice | wc -l
      # Stroke order for handwriting practice (hanzi-writer-data, Arphic Public License).
      - name: Stroke data
        run: |
          mkdir -p /tmp/hw && cd /tmp/hw && npm pack hanzi-writer-data@2.0.1 --silent && tar xzf hanzi-writer-data-*.tgz
          cd "$GITHUB_WORKSPACE" && python3 tools/make_strokes.py /tmp/hw/package
      # Offline Chinese recognizer model (Vosk small-cn 0.22, Apache 2.0), bundled in the APK so
      # it works with no internet and nothing to download in China. Downloaded once, then cached.
      - uses: actions/cache@v4
        with:
          path: ~/vosk-model
          key: vosk-model-small-cn-0.22
      - name: Speech model
        env:
          # Pinned fingerprint of the zip (first seen in build 29): a changed or corrupted
          # download fails the build instead of shipping.
          MODEL_SHA256: "3af8b0e7e0f835ae9d414ce5df580237a3cfb08d586c9fbbb0f7ff29ad5b14ba"
        run: |
          set -e
          zip=~/vosk-model/vosk-model-small-cn-0.22.zip
          if [ ! -f "$zip" ]; then
            mkdir -p ~/vosk-model
            curl -fsSL --retry 3 -o "$zip" https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip
          fi
          sum=$(sha256sum "$zip" | cut -d' ' -f1)
          if [ -n "$MODEL_SHA256" ] && [ "$sum" != "$MODEL_SHA256" ]; then
            echo "::error title=Speech model::Checksum mismatch: got $sum"; exit 1
          fi
          [ -z "$MODEL_SHA256" ] && echo "::notice title=Speech model sha256::$sum"
          rm -rf /tmp/vosk && mkdir -p /tmp/vosk && unzip -q "$zip" -d /tmp/vosk
          dest=app/src/main/assets/vosk-cn
          rm -rf "$dest" && mkdir -p "$dest"
          cp -r /tmp/vosk/vosk-model-small-cn-0.22/. "$dest/"
          # The app re-copies the model onto the phone only when this changes.
          echo "small-cn-0.22-$sum" > "$dest/uuid"
          # Facts for planning the tone check: sizes, and whether the model's sounds carry tones.
          files=$(cd "$dest" && find . -type f -printf '%p %s\n' | sort | tr '\n' ';')
          phones=$(find "$dest" -name 'phones.txt' | head -1)
          tonal="no phones.txt found"
          if [ -n "$phones" ]; then
            tonal="$(wc -l < "$phones") phones; with a tone digit: $(grep -cE '^[a-z]+[1-5]' "$phones" || true); sample: $(head -40 "$phones" | cut -d' ' -f1 | tr '\n' ' ')"
          fi
          words=$(find "$dest" -name 'words.txt' | head -1)
          echo "::notice title=Speech model::$(du -sh "$dest" | cut -f1) · $tonal · words: ${words:+$(wc -l < "$words")} · files: $files"
      # Phrase tone model: retrained from the native recordings (assets/voice) whenever 50 or more
      # phrases have been added since it was last trained. On main, the new model is committed back.
      - name: Tone model
        env:
          MODEL_KT: app/src/main/java/com/dudlatitat/nextchapter/speech/PhraseToneModel.kt
        run: |
          set -e
          pip install --quiet pypinyin
          T=tools/tone_proto; DATA=app/src/main/java/com/dudlatitat/nextchapter/data
          have=$(grep -oP 'const val PHRASES = \K[0-9]+' "$MODEL_KT")
          now=$(python3 $T/phrase_collect.py $T $T app/src/main/assets/vosk-cn app/src/main/assets/voice $DATA /tmp/tones.pkl --count)
          echo "::notice title=Tone model::trained on $have phrases; $now have recordings now"
          if [ $((now - have)) -lt 50 ]; then exit 0; fi
          command -v ffmpeg >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          pip install --quiet vosk numpy scikit-learn
          python3 $T/phrase_collect.py $T $T app/src/main/assets/vosk-cn app/src/main/assets/voice $DATA /tmp/tones.pkl
          (cd $T && python3 phrase_tones.py /tmp/tones.pkl "$GITHUB_WORKSPACE/$MODEL_KT") | tee /tmp/tones.log
          echo "::notice title=Tone model retrained ($now phrases)::$(grep -E 'fold|golden' /tmp/tones.log | tr '\n' ' ' | sed 's/%/%25/g')"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$MODEL_KT"
            git commit -m "Retrain the phrase tone model on $now phrases [skip ci]" && git pull --rebase -q && git push || echo "::warning::Couldn't commit the new tone model"
          fi
      - name: Unlock signing key
        env:
          NC_KEY_PASSWORD: ${{ secrets.NC_KEY_PASSWORD }}
        run: |
          if [ -z "$NC_KEY_PASSWORD" ]; then
            echo "::error::Add the NC_KEY_PASSWORD secret (Settings → Secrets and variables → Actions)."; exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/next-chapter.jks.enc -out "$RUNNER_TEMP/nc.jks" -pass env:NC_KEY_PASSWORD
      - name: Build
        env:
          NC_KEY_PASSWORD: ${{ secrets.NC_KEY_PASSWORD }}
          NC_KEYSTORE: ${{ runner.temp }}/nc.jks
        run: |
          set -o pipefail
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease --stacktrace 2>&1 | tee build.log
      # Repeat compiler errors as one annotation, readable without the full log.
      - name: Summarise build errors
        if: failure()
        run: |
          errors=$(grep -E "^e: |Error: |What went wrong|FAILED|Test.*>.*FAILED" -A4 build.log | grep -v "^\s*at " | head -60 || true)
          errors=${errors//'%'/'%25'}
          errors=${errors//$'\n'/'%0A'}
          echo "::error title=Build errors::${errors:-No error lines found; see the full log.}"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk next-chapter-1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: next-chapter-apk
          path: next-chapter-*.apk
      # Newest APK always at the "latest" release, easy to grab on the phone.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest next-chapter-*.apk --title "Next Chapter 1.${{ github.run_number }}" --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7}" --latest
