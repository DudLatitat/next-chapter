name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk next-chapter-1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: next-chapter-apk
          path: next-chapter-*.apk
      # Newest APK always at the "latest" release, easy to grab on the phone.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest next-chapter-*.apk --title "Next Chapter 1.${{ github.run_number }}" --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7}" --latest
